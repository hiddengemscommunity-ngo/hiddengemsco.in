<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cohort Internship Application - AdhyaA Labs</title>
    <style>
      .container {
            width: 600px;
            padding: 40px;
        }

        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; width: 100%; max-width: 600px; padding: 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .badge { display: inline-block; background-color: rgba(79, 70, 229, 0.15); color: #818cf8; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
        h2 { font-size: 24px; margin-bottom: 8px; color: var(--text-main); }
        p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        input, select, textarea { width: 100%; padding: 12px 16px; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 14px; transition: border-color 0.2s; }
        input::placeholder, textarea::placeholder { color: #64748b; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
        textarea { resize: vertical; min-height: 100px; }
        button { width: 100%; background-color: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: var(--primary-hover); }
        @media screen and (max-width: 768px) {
            .container {
                width: 100%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">Structured Program · ₹999</span>
        <h2>Cohort Internship Application</h2>
        <p>Secure your spot in the next cohort. 1:1 mentorship and guaranteed hackathon entry included.</p>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@email.com" required>
            </div>
            <div class="form-group">
                <label for="college">College / Institution</label>
                <input type="text" id="college" name="college" placeholder="Where do you study?" required>
            </div>
            <div class="form-group">
                <label for="goals">Why do you want to join this cohort?</label>
                <textarea id="goals" name="goals" placeholder="Tell us about your goals..." required></textarea>
            </div>
            <button type="submit">Submit Application &rarr;</button>
        </form>
    </div>
</body>
</html>
