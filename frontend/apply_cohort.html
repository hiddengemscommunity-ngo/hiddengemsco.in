<section style="padding: 150px 0 90px; min-height: 80vh; display: flex; align-items: center; background: var(--wash-sapphire);">
  <div class="wrap" style="max-width: 640px; width: 100%;">
    <div class="surface reveal in" style="padding: 44px; border-top: 4px solid var(--sapphire);">
      <span class="eyebrow" style="margin-bottom: 8px;">Structured Program · ₹999</span>
      <h1 style="font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; margin-bottom: 12px;">Cohort Internship Application</h1>
      <p style="color: var(--ink-soft); margin-bottom: 32px;">Secure your spot in the next cohort. 1:1 mentorship and guaranteed hackathon entry included.</p>
      
      <form id="cohortForm" style="display: flex; flex-direction: column; gap: 20px;">
        <label style="font-size: 0.85rem; font-weight: 600; color: var(--ink-soft); display: flex; flex-direction: column; gap: 8px;">
          Full Name
          <input type="text" required placeholder="Enter your full name" style="padding: 12px 16px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--paper); font-family: var(--font-body); font-size: 1rem;">
        </label>
        
        <label style="font-size: 0.85rem; font-weight: 600; color: var(--ink-soft); display: flex; flex-direction: column; gap: 8px;">
          Email Address
          <input type="email" required placeholder="you@email.com" style="padding: 12px 16px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--paper); font-family: var(--font-body); font-size: 1rem;">
        </label>

        <label style="font-size: 0.85rem; font-weight: 600; color: var(--ink-soft); display: flex; flex-direction: column; gap: 8px;">
          College / Institution
          <input type="text" required placeholder="Where do you study?" style="padding: 12px 16px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--paper); font-family: var(--font-body); font-size: 1rem;">
        </label>

        <label style="font-size: 0.85rem; font-weight: 600; color: var(--ink-soft); display: flex; flex-direction: column; gap: 8px;">
          Why do you want to join this cohort?
          <textarea rows="4" required placeholder="Tell us about your goals..." style="padding: 12px 16px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--paper); font-family: var(--font-body); font-size: 1rem; resize: vertical;"></textarea>
        </label>

        <button type="submit" class="btn btn-primary" style="margin-top: 10px; justify-content: center; width: 100%;">Submit Application →</button>
      </form>
    </div>
  </div>
</section>
