<section style="padding: 150px 0 90px; min-height: 80vh; display: flex; align-items: center; background: var(--paper);">
  <div class="wrap" style="max-width: 500px; width: 100%;">
    <div class="surface reveal in" style="padding: 44px; text-align: center; border-top: 4px solid var(--emerald);">
      <div class="icon-chip chip-emerald" style="margin: 0 auto 20px;"><svg viewBox="0 0 24 24" style="color:var(--emerald); width: 24px; height: 24px;"><use href="#icon-letter"/></svg></div>
      <h1 style="font-family: var(--font-display); font-size: 2rem; font-weight: 700; margin-bottom: 12px;">You're almost on the list</h1>
      <p style="color: var(--ink-soft); margin-bottom: 32px;">Drop your email below. We'll send you a direct alert the second registrations open.</p>
      
      <form id="waitlistForm" style="display: flex; flex-direction: column; gap: 16px; text-align: left;">
        <input type="email" required placeholder="you@email.com" style="padding: 14px 20px; border-radius: 100px; border: 1.5px solid var(--line); background: var(--paper-2); font-family: var(--font-body); font-size: 1rem; width: 100%;">
        
        <button type="submit" class="btn btn-emerald" style="justify-content: center; width: 100%;">Join Waitlist →</button>
      </form>
      <p style="font-size: 0.8rem; color: var(--ink-faint); margin-top: 20px;">We respect your inbox. No spam, ever.</p>
    </div>
  </div>
</section>
