<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Quote - AdhyaA Labs</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; width: 100%; max-width: 600px; padding: 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { font-size: 24px; margin-bottom: 8px; color: var(--text-main); }
        p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        input, select, textarea { width: 100%; padding: 12px 16px; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 14px; transition: border-color 0.2s; }
        input::placeholder, textarea::placeholder { color: #64748b; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
        textarea { resize: vertical; min-height: 120px; }
        button { width: 100%; background-color: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: var(--primary-hover); }
    </style>
</head>
<body>
    <div class="container">
        <h2>Request a Project Quote</h2>
        <p>Tell us about your project scope and specifications for a customized estimate.</p>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">Your Name / Company Name</label>
                <input type="text" id="name" name="name" placeholder="Enter name or organization" required>
            </div>
            <div class="form-group">
                <label for="email">Business Email</label>
                <input type="email" id="email" name="email" placeholder="name@company.com" required>
            </div>
            <div class="form-group">
                <label for="service">Service Required</label>
                <select id="service" name="service" required>
                    <option value="" disabled selected>Select a service type</option>
                    <option value="custom-software">Custom Web/App Development</option>
                    <option value="ai-ml">AI / Machine Learning Solutions</option>
                    <option value="iot-dev">IoT & Hardware Prototyping</option>
                </select>
            </div>
            <div class="form-group">
                <label for="details">Project Details</label>
                <textarea id="details" name="details" placeholder="Describe your requirements..." required></textarea>
            </div>
            <button type="submit">Submit Request &rarr;</button>
        </form>
    </div>
</body>
</html>
